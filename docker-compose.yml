services:
  chat-api:
    build: ./services/chat-api
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      MCP_SEARCH_URL: http://mcp-search:8001/mcp
      MCP_MARKET_URL: http://mcp-market:8002/mcp
    ports:
      - "8000:8000"
    depends_on:
      mcp-search:
        condition: service_started
      mcp-market:
        condition: service_started
  mcp-search:
    build: ./services/mcp-search
    environment:
      PORT: "8001"
    ports:
      - "8001:8001"
  mcp-market:
    build: ./services/mcp-market
    environment:
      PORT: "8002"
    ports:
      - "8002:8002"
  web:
    build: ./apps/web
    ports:
      - "3000:80"
    depends_on:
      chat-api:
        condition: service_started
